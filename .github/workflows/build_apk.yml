name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Clean Android Project & Setup Firebase
        run: |
          # 1. حفظ ملف google-services.json مؤقتاً
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json /tmp/google-services.json
          fi

          # 2. إزالة مجلد الأندرويد القديم
          rm -rf android

          # 3. إعادة إنشاء مشروع أندرويد حديث
          flutter create --org com.example --project-name apk_main --platforms=android .

          # 4. استعادة ملف google-services.json
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

          # 5. إضافة مستودعات التنزيل مع إضافة فايربيز
          if [ -f "android/build.gradle.kts" ]; then
            echo 'buildscript { repositories { google(); mavenCentral() }; dependencies { classpath("com.google.gms:google-services:4.4.1") } }' >> android/build.gradle.kts
            echo 'apply(plugin = "com.google.gms.google-services")' >> android/app/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
            echo 'buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.google.gms:google-services:4.4.1" } }' >> android/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
