name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Clean Android Project & Setup Firebase
        run: |
          # 1. حفظ ملف google-services.json مؤقتاً إذا كان موجوداً
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json /tmp/google-services.json
          fi

          # 2. إزالة مجلد الأندرويد المكسور القديم بالكامل
          rm -rf android

          # 3. إنشاء هيكل أندرويد جديد ونظيف متوافق 100% مع أحدث إصدارات فلاتر
          flutter create --org com.example --project-name apk_main --platforms=android .

          # 4. إعادة ملف google-services.json إلى مكانه الصحيح
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

          # 5. إضافة إعدادات فايربيز لملفات Gradle الجديدة
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
